# =============================
# ?? Configuración general de Gradle
# =============================

# Aumenta la memoria asignada al daemon de Gradle (ajusta según tu RAM)
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Habilita el daemon para mantener Gradle en memoria entre compilaciones
org.gradle.daemon=true

# Compila en paralelo (ideal si tienes varios núcleos de CPU)
org.gradle.parallel=true

# Usa caché de compilación para evitar recompilar módulos sin cambios
org.gradle.caching=true

# =============================
# ? Configuración de Android
# =============================

# Usa AndroidX (requerido para versiones modernas)
android.useAndroidX=true

# Hace que cada librería use su propio R.class (reduce tamaño del build)
android.nonTransitiveRClass=true

# =============================
# ? Configuración de Kotlin
# =============================

# Usa estilo oficial de código Kotlin
kotlin.code.style=official

# Activa compilación incremental (reduce tiempo de build)
kotlin.incremental=true
kotlin.incremental.android=true

# =============================
# ? Notas de optimización
# =============================
# - Evita usar "Clean Project" salvo que haya errores grandes.
# - Usa "Apply Changes" o "Run" para probar más rápido.
# - Mantén actualizado Android Studio y el plugin de Kotlin.
# - Usa un emulador x86_64 con aceleración por hardware (HAXM/WHPX).

